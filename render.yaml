# Render blueprint: one web service with a persistent disk for the business database.
# Disks need a paid Render instance type.
services:
  - type: web
    name: cosmetics-erp
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: gunicorn erp_web.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /login/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: cosmetics-erp.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://cosmetics-erp.onrender.com
      - key: ERP_DB_PATH
        value: /var/data/cosmetics_3sim_erp.db
    disk:
      name: erp-data
      mountPath: /var/data
      sizeGB: 1
