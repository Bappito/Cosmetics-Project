<!doctype html>
<html lang="{{ lang }}" dir="{{ t.dir }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cosmetics ERP · {{ t.login_title }}</title>
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#f5f7fb; color:#1f2937; font-family:"Segoe UI", Tahoma, Heebo, sans-serif; }
    .box { width:min(360px, 92vw); background:#fff; border:1px solid #cbd5e1; border-radius:10px; padding:1.5rem; box-shadow:0 2px 8px rgba(15,23,42,.06); }
    h1 { font-size:1.3rem; margin:0 0 1rem; }
    label { display:block; font-size:.9rem; color:#526174; margin:.6rem 0 .2rem; }
    input { width:100%; padding:.55rem .6rem; border:1px solid #cbd5e1; border-radius:6px; font-size:1rem; }
    button { margin-top:1rem; width:100%; padding:.6rem; border:0; border-radius:6px; background:#0b69c7; color:#fff; font-weight:700; font-size:1rem; cursor:pointer; }
    .err { color:#991b1b; margin-top:.6rem; font-size:.92rem; }
    .lang { display:block; margin-top:1rem; text-align:center; font-size:.9rem; }
    .lang a { color:#0b69c7; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Cosmetics ERP · {{ t.login_title }}</h1>
    <form method="post">
      {% csrf_token %}
      <label for="id_username">{{ t.username }}</label>
      <input id="id_username" name="username" autocomplete="username" autofocus required>
      <label for="id_password">{{ t.password }}</label>
      <input id="id_password" name="password" type="password" autocomplete="current-password" required>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit">{{ t.sign_in }}</button>
      {% if form.errors %}<div class="err">{{ t.login_error }}</div>{% endif %}
    </form>
    <a class="lang" href="?lang={{ t.lang_param }}">{{ t.other_lang }}</a>
  </div>
</body>
</html>
